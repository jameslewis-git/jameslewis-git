name: Daily Contribution

on:
  schedule:
    - cron: '30 1 * * *'   # 7:00 AM IST every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make realistic commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git

          TODAY=$(date -u +%Y-%m-%d)

          # Realistic commit count: weighted toward 1-4, occasionally more
          ROLL=$((RANDOM % 10))
          if [ $ROLL -lt 2 ]; then
            COMMITS=0
          elif [ $ROLL -lt 5 ]; then
            COMMITS=1
          elif [ $ROLL -lt 8 ]; then
            COMMITS=$((RANDOM % 3 + 2))   # 2-4
          else
            COMMITS=$((RANDOM % 3 + 4))   # 4-6
          fi

          echo "Today ($TODAY): $COMMITS commits"

          if [ "$COMMITS" -eq 0 ]; then
            echo "Taking the day off today."
            exit 0
          fi

          # Realistic commit messages pool
          MESSAGES=(
            "fix: resolve edge case in input validation"
            "refactor: clean up utility functions"
            "docs: update README with usage examples"
            "chore: update dependencies"
            "feat: add error handling for API calls"
            "fix: correct off-by-one error in loop"
            "style: improve code formatting"
            "test: add unit tests for core module"
            "refactor: extract helper into separate module"
            "docs: add inline comments for clarity"
            "fix: handle null response gracefully"
            "chore: remove unused imports"
            "feat: improve logging output"
            "fix: typo in variable name"
            "refactor: simplify conditional logic"
            "docs: update changelog"
            "chore: sync config with latest standards"
            "feat: add retry logic on failure"
            "fix: prevent duplicate entries"
            "refactor: move constants to config file"
          )

          # Update activity-log.json using jq (no Python heredoc issues)
          LOG_FILE="activity-log.json"

          # Read existing data or create fresh
          if [ -f "$LOG_FILE" ]; then
            TOTAL=$(jq '.total_commits // 0' "$LOG_FILE")
            LOG=$(jq '.log // []' "$LOG_FILE")
          else
            TOTAL=0
            LOG='[]'
          fi

          NEW_TOTAL=$((TOTAL + COMMITS))

          # Append today's entry (or update if already exists)
          LOG=$(echo "$LOG" | jq --arg date "$TODAY" --argjson commits "$COMMITS" '
            if (map(select(.date == $date)) | length) > 0
            then map(if .date == $date then .commits = $commits else . end)
            else . + [{"date": $date, "commits": $commits}]
            end | .[-365:]
          ')

          # Calculate streak
          STREAK=$(echo "$LOG" | jq '[reverse[] | select(.commits > 0)] | length')

          # Write back
          jq -n \
            --arg date "$TODAY" \
            --argjson total "$NEW_TOTAL" \
            --argjson streak "$STREAK" \
            --argjson log "$LOG" \
            '{"last_updated": $date, "total_commits": $total, "streak": $streak, "log": $log}' \
            > "$LOG_FILE"

          echo "Log updated: total=$NEW_TOTAL streak=$STREAK"

          # Make commits with realistic messages and slight time variation
          MSG_COUNT=${#MESSAGES[@]}
          git add activity-log.json
          git commit -m "${MESSAGES[$((RANDOM % MSG_COUNT))]}"

          # Each remaining commit needs a real file change to avoid "nothing to commit"
          for i in $(seq 2 $COMMITS); do
            IDX=$((RANDOM % MSG_COUNT))
            MSG="${MESSAGES[$IDX]}"
            # Touch the log file with a small update so git has a real change
            jq --arg ts "$(date -u +%H:%M:%S)" '.last_run_time = $ts' "$LOG_FILE" > "$LOG_FILE.tmp" && mv "$LOG_FILE.tmp" "$LOG_FILE"
            git add activity-log.json
            git commit -m "$MSG"
            sleep $((RANDOM % 3 + 1))
          done

          git push
