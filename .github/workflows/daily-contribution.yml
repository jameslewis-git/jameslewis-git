name: Daily Contribution

on:
  schedule:
    - cron: '30 1 * * *'   # 7:00 AM IST every day
  workflow_dispatch:

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make random commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Random number: 0, 1, 2, or 3
          COMMITS=$((RANDOM % 4))
          echo "Today's commits: $COMMITS"

          for i in $(seq 1 $COMMITS); do
            git commit --allow-empty -m "chore: daily contribution $(date -u +%Y-%m-%d) #$i"
          done

          if [ "$COMMITS" -gt 0 ]; then
            git push
          else
            echo "Skipping today (0 commits)"
          fi
